# Blood Pressure Log — v7
# Static site, no build step. Supabase is called directly from the browser.

[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/*"
  to = "/index-v7.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
